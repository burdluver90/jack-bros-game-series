<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2f33"/><stop offset="1" stop-color="#17191c"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a7444"/><stop offset="1" stop-color="#6b4e2b"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8e2c9" stop-opacity=".55"/><stop offset=".35" stop-color="#fffbe9" stop-opacity=".95"/><stop offset="1" stop-color="#cfc6a5" stop-opacity=".6"/></linearGradient>
    <radialGradient id="lamp" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#fff3c0" stop-opacity=".55"/><stop offset="1" stop-color="#fff3c0" stop-opacity="0"/></radialGradient>
    <g id="bottle">
      <rect x="-28" y="-150" width="56" height="150" rx="10" fill="url(#glass)" stroke="#8c8466" stroke-width="3"/>
      <rect x="-14" y="-190" width="28" height="44" rx="4" fill="url(#glass)" stroke="#8c8466" stroke-width="3"/>
      <rect x="-16" y="-206" width="32" height="18" rx="3" fill="#3b6fb6"/>
      <rect x="-28" y="-104" width="56" height="44" fill="#f4efe0" opacity=".9"/>
      <text y="-86" font-family="Arial" font-weight="bold" font-size="12" text-anchor="middle" fill="#3b3a32">ALMOND</text>
      <text y="-70" font-family="Arial" font-weight="bold" font-size="12" text-anchor="middle" fill="#3b3a32">WATER</text>
    </g>
    <radialGradient id="d2lamp"><stop offset="0" stop-color="#fff6c8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></radialGradient>
    <radialGradient id="d2ball" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#cbd5e1"/><stop offset="1" stop-color="#64748b"/></radialGradient>
    <filter id="d2glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#lamp)"/>
  <rect x="640" y="0" width="320" height="16" fill="#fff6c8"/>
  <rect y="760" width="1600" height="140" fill="#24272a"/>
  <!-- open crate -->
  <g transform="translate(300 330)">
    <rect width="760" height="430" fill="url(#wood)" stroke="#3f2d17" stroke-width="10"/>
    <g stroke="#4d3920" stroke-width="6"><line x1="0" y1="140" x2="760" y2="140"/><line x1="0" y1="290" x2="760" y2="290"/></g>
    <text x="380" y="230" font-family="Arial" font-weight="bold" font-size="54" fill="#2b2012" text-anchor="middle" opacity=".75">ALMOND WATER</text>
    <text x="380" y="270" font-family="Arial" font-size="26" fill="#2b2012" text-anchor="middle" opacity=".6">DRINK WHEN THE WALLS START TO SMILE</text>
    <rect x="-20" y="-40" width="800" height="50" fill="#a4804f" stroke="#3f2d17" stroke-width="8" transform="rotate(-6 0 0)"/>
  </g>
  <!-- bottles sticking out of crate -->
  <use href="#bottle" transform="translate(430 350)"/><use href="#bottle" transform="translate(520 345) rotate(-4)"/>
  <use href="#bottle" transform="translate(610 352)"/><use href="#bottle" transform="translate(700 348) rotate(3)"/>
  <use href="#bottle" transform="translate(790 352)"/><use href="#bottle" transform="translate(880 346) rotate(-3)"/>
  <!-- crowbar leaning on the crate -->
  <g transform="translate(1180 760) rotate(-18)">
    <rect x="-9" y="-560" width="18" height="560" rx="6" fill="#b3261e"/>
    <path d="M0 -560 q0 -60 -60 -70" stroke="#b3261e" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M-6 0 l-30 26" stroke="#8d8f92" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- loose bottle on floor -->
  <use href="#bottle" transform="translate(1380 830) rotate(80)"/>
  <!-- detail pass 2 -->
  <!-- metal shelving in the background with more boxes -->
  <g fill="#3b3f46"><rect x="80" y="160" width="12" height="560"/><rect x="420" y="160" width="12" height="560"/><rect x="80" y="300" width="352" height="12"/><rect x="80" y="480" width="352" height="12"/></g>
  <g fill="#8b6b3e"><rect x="110" y="220" width="120" height="80"/><rect x="250" y="240" width="140" height="60"/><rect x="130" y="400" width="160" height="80"/></g>
  <g font-family="Arial" font-size="16" fill="#3b2a12"><text x="120" y="262">ALMOND W.</text><text x="140" y="446">CASE 7 / 12</text></g>
  <!-- a note taped to the crate -->
  <g transform="translate(980 540) rotate(-5)"><rect x="0" y="0" width="190" height="110" fill="#fef9c3"/><rect x="70" y="-10" width="50" height="20" fill="#e5e7eb" opacity=".8"/>
    <text x="12" y="34" font-family="Comic Sans MS, Arial" font-size="18" fill="#111">drink 1 when</text><text x="12" y="60" font-family="Comic Sans MS, Arial" font-size="18" fill="#111">things smile.</text><text x="12" y="88" font-family="Comic Sans MS, Arial" font-size="18" fill="#b91c1c">NOT THE RED ONE</text></g>
  <!-- straw packing spilling out, and a spilled puddle under the bottle -->
  <g stroke="#d6b25e" stroke-width="3" opacity=".8"><path d="M578 769 l-14 6"/><path d="M840 785 l18 6"/><path d="M711 787 l-25 -5"/><path d="M844 827 l11 -3"/><path d="M913 829 l5 -1"/><path d="M689 772 l-4 -3"/><path d="M566 816 l18 2"/><path d="M896 874 l-4 -3"/><path d="M875 848 l21 5"/><path d="M595 848 l23 -1"/><path d="M839 797 l-3 5"/><path d="M713 858 l25 -7"/><path d="M983 796 l-24 -8"/><path d="M883 777 l-9 5"/><path d="M687 781 l30 -6"/><path d="M732 831 l14 -5"/><path d="M680 873 l5 7"/><path d="M969 817 l15 0"/><path d="M562 803 l-6 -8"/><path d="M962 778 l17 4"/><path d="M664 861 l13 -8"/><path d="M648 843 l-2 5"/><path d="M601 813 l14 0"/><path d="M805 836 l14 -3"/><path d="M829 828 l-11 0"/><path d="M604 788 l26 -7"/><path d="M814 808 l19 -8"/><path d="M904 818 l8 5"/><path d="M709 847 l-10 5"/><path d="M738 863 l-11 0"/></g>
  <ellipse cx="1380" cy="870" rx="150" ry="18" fill="#bfdbfe" opacity=".35"/>
  <!-- one red bottle hidden among the rest -->
  <g transform="translate(1240 820) rotate(-10)"><rect x="-12" y="-60" width="24" height="60" rx="6" fill="#dc2626"/><rect x="-7" y="-74" width="14" height="14" fill="#7f1d1d"/></g>
  <!-- dust in the lamp light -->
  <circle cx="774" cy="122" r="2" fill="#fff6c8" opacity="0.4"/><circle cx="621" cy="254" r="2" fill="#fff6c8" opacity="0.6"/><circle cx="844" cy="427" r="2" fill="#fff6c8" opacity="0.6"/><circle cx="730" cy="315" r="2" fill="#fff6c8" opacity="0.4"/><circle cx="953" cy="85" r="2" fill="#fff6c8" opacity="0.4"/><circle cx="711" cy="497" r="2" fill="#fff6c8" opacity="0.4"/><circle cx="674" cy="297" r="2" fill="#fff6c8" opacity="0.4"/><circle cx="656" cy="357" r="2" fill="#fff6c8" opacity="0.4"/><circle cx="661" cy="182" r="2" fill="#fff6c8" opacity="0.6"/><circle cx="994" cy="266" r="2" fill="#fff6c8" opacity="0.25"/><circle cx="618" cy="172" r="2" fill="#fff6c8" opacity="0.25"/><circle cx="726" cy="430" r="2" fill="#fff6c8" opacity="0.6"/><circle cx="924" cy="280" r="2" fill="#fff6c8" opacity="0.25"/><circle cx="808" cy="453" r="2" fill="#fff6c8" opacity="0.25"/><circle cx="741" cy="142" r="2" fill="#fff6c8" opacity="0.4"/><circle cx="889" cy="115" r="2" fill="#fff6c8" opacity="0.6"/><circle cx="999" cy="86" r="2" fill="#fff6c8" opacity="0.25"/><circle cx="977" cy="300" r="2" fill="#fff6c8" opacity="0.4"/><circle cx="912" cy="387" r="2" fill="#fff6c8" opacity="0.4"/><circle cx="750" cy="80" r="2" fill="#fff6c8" opacity="0.6"/><circle cx="956" cy="375" r="2" fill="#fff6c8" opacity="0.6"/><circle cx="686" cy="60" r="2" fill="#fff6c8" opacity="0.25"/><circle cx="981" cy="133" r="2" fill="#fff6c8" opacity="0.25"/><circle cx="669" cy="352" r="2" fill="#fff6c8" opacity="0.6"/><circle cx="671" cy="414" r="2" fill="#fff6c8" opacity="0.4"/><circle cx="840" cy="499" r="2" fill="#fff6c8" opacity="0.6"/><circle cx="751" cy="331" r="2" fill="#fff6c8" opacity="0.25"/><circle cx="622" cy="348" r="2" fill="#fff6c8" opacity="0.6"/><circle cx="652" cy="207" r="2" fill="#fff6c8" opacity="0.25"/><circle cx="668" cy="219" r="2" fill="#fff6c8" opacity="0.25"/><circle cx="681" cy="478" r="2" fill="#fff6c8" opacity="0.25"/><circle cx="705" cy="258" r="2" fill="#fff6c8" opacity="0.4"/><circle cx="987" cy="357" r="2" fill="#fff6c8" opacity="0.25"/><circle cx="873" cy="340" r="2" fill="#fff6c8" opacity="0.4"/><circle cx="939" cy="225" r="2" fill="#fff6c8" opacity="0.6"/><circle cx="933" cy="152" r="2" fill="#fff6c8" opacity="0.6"/><circle cx="887" cy="419" r="2" fill="#fff6c8" opacity="0.4"/><circle cx="833" cy="493" r="2" fill="#fff6c8" opacity="0.6"/><circle cx="926" cy="106" r="2" fill="#fff6c8" opacity="0.4"/><circle cx="794" cy="436" r="2" fill="#fff6c8" opacity="0.4"/>
</svg>
