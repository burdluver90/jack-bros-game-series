<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rainbow Joust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#5a2ca8; --pink:#ff6fb5; --panel:#fffaff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#8fd3ff;
    font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif; color:var(--ink);
    user-select:none; -webkit-user-select:none; touch-action:none; }
  canvas#game { position:fixed; inset:0; display:block; }
  body.playing canvas#game { cursor:none; }

  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(120,70,200,.25); padding:12px; overflow-y:auto; touch-action:pan-y; }
  .overlay.hidden { display:none; }
  .panel { background:var(--panel); border-radius:28px; padding:18px 22px 20px; max-width:860px; width:100%;
    box-shadow:0 10px 0 #d9c2ff, 0 18px 40px rgba(80,30,160,.3); margin:auto; text-align:center; }
  h1 { margin:0 0 6px; font-size:clamp(28px,5vw,46px); color:var(--pink);
    text-shadow:3px 3px 0 #ffe14d, 6px 6px 0 #c9b3ff; }
  h2 { margin:10px 0 6px; font-size:19px; text-align:left; }
  .row { display:flex; gap:18px; align-items:center; justify-content:center; flex-wrap:wrap; }
  #preview { width:240px; height:280px; background:linear-gradient(#bfe6ff,#ffe3f3 70%,#aee59c 70%);
    border-radius:22px; border:4px solid #e7d9ff; flex:none; }
  .choices { flex:1; min-width:260px; max-width:500px; }
  .riders { display:flex; gap:10px; }
  .rider { flex:1; font:inherit; font-size:16px; padding:10px 4px; border-radius:18px; border:4px solid #e7d9ff;
    background:#fff; color:var(--ink); cursor:pointer; }
  .rider .big { font-size:30px; display:block; }
  .rider.on { border-color:var(--pink); background:#fff0f8; box-shadow:0 4px 0 var(--pink); }
  .sw { display:flex; flex-wrap:wrap; gap:9px; }
  .sw button { width:44px; height:44px; border-radius:50%; border:4px solid #fff; cursor:pointer;
    box-shadow:0 0 0 3px #e7d9ff; padding:0; }
  .sw button.on { box-shadow:0 0 0 4px var(--pink); transform:scale(1.12); }
  .sw { row-gap:16px; }
  .sw button { position:relative; }
  .sw button.locked { filter:saturate(.6) brightness(.95); }
  .sw button.locked::after { content:'🔒' attr(data-price); position:absolute; bottom:-13px; left:50%; transform:translateX(-50%);
    font-size:11px; white-space:nowrap; background:#fff; color:var(--ink); border-radius:8px; padding:0 4px; box-shadow:0 0 0 2px #e7d9ff; }
  .bank { float:right; background:#fff0f8; border-radius:12px; padding:0 10px; }
  .shop { display:flex; flex-wrap:wrap; gap:8px; }
  .shopItem { font:inherit; font-size:15px; border:4px solid #e7d9ff; border-radius:16px; background:#fff; color:var(--ink);
    padding:6px 10px; cursor:pointer; touch-action:manipulation; }
  .shopItem.on { border-color:var(--pink); background:#fff0f8; }
  .shopItem.locked { background:#f3eefc; }
  .shopItem small { display:block; font-size:12px; opacity:.8; }
  #shopMsg { min-height:24px; margin-top:6px; font-size:17px; color:var(--pink); text-align:left; }
  @keyframes wiggle { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .wiggle { animation:wiggle .3s; }
  input#name { font:inherit; font-size:20px; padding:8px 14px; border-radius:14px; border:4px solid #e7d9ff;
    color:var(--ink); width:100%; max-width:260px; touch-action:manipulation; }
  .go { font:inherit; font-size:28px; font-weight:700; color:#fff; background:linear-gradient(#ff8ac6,#ff5fae);
    border:none; border-radius:22px; padding:12px 40px; margin-top:16px; cursor:pointer;
    box-shadow:0 6px 0 #d63f8c; touch-action:manipulation; }
  .go:active { transform:translateY(4px); box-shadow:0 2px 0 #d63f8c; }
  .go.alt { background:linear-gradient(#b99cff,#8f68ff); box-shadow:0 6px 0 #6a43d6; font-size:22px; padding:10px 26px; }
  .help { margin:12px 0 0; font-size:16px; opacity:.85; }
  #armorBox.off { opacity:.35; pointer-events:none; }

  #topBtns { position:fixed; top:10px; right:10px; display:flex; gap:8px; z-index:5; }
  #topBtns button { font-size:24px; width:50px; height:50px; border-radius:16px; border:none;
    background:rgba(255,255,255,.85); cursor:pointer; touch-action:manipulation; }
  #topBtns.hidden { display:none; }

  .tbtn { position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); width:112px; height:112px; border-radius:50%;
    border:5px solid rgba(255,255,255,.9); color:#fff; font:inherit; font-weight:700; font-size:18px;
    display:none; align-items:center; justify-content:center; flex-direction:column; z-index:4; touch-action:none; }
  .tbtn span { font-size:38px; line-height:1; }
  #jumpBtn { left:18px; background:rgba(80,180,255,.55); }
  #atkBtn { right:18px; background:rgba(255,95,174,.6); }
  .tbtn.down { transform:scale(.92); filter:brightness(1.2); }
  body.touch.playing .tbtn { display:flex; }

  #endStars { font-size:54px; letter-spacing:6px; margin:6px 0; }
  #endStats { font-size:22px; line-height:1.5; }
  .stars-dim { opacity:.25; }
  @media (max-height:520px) {
    #preview { width:180px; height:210px; }
    .panel { padding:12px 16px; }
    h2 { margin:6px 0 4px; }
    .go { margin-top:10px; padding:8px 30px; font-size:24px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="topBtns" class="hidden">
  <button id="muteBtn" title="Sound on/off (M)">🔊</button>
  <button id="pauseBtn" title="Pause (P)">⏸️</button>
</div>
<button id="jumpBtn" class="tbtn"><span>⬆️</span>JUMP</button>
<button id="atkBtn" class="tbtn"><span id="atkIcon">⚔️</span>ATTACK</button>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>🦄 Rainbow Joust 🌈</h1>
    <div class="row">
      <canvas id="preview" width="480" height="560"></canvas>
      <div class="choices">
        <h2>Who's riding?</h2>
        <div class="riders">
          <button class="rider" data-rider="1"><span class="big">🛡️🦄</span>Knight + Unicorn</button>
          <button class="rider" data-rider="2"><span class="big">🌙👸</span>Night Princess</button>
          <button class="rider" data-rider="0"><span class="big">⚡🦄</span>Just Unicorn</button>
        </div>
        <h2>Fur</h2><div class="sw" id="furSw"></div>
        <h2>Mane &amp; Tail</h2><div class="sw" id="maneSw"></div>
        <div id="armorBox"><h2 id="armorLabel">Armor</h2><div class="sw" id="armorSw"></div></div>
        <h2>Unicorn's name</h2><input id="name" maxlength="14" value="Sparkle" autocomplete="off">
        <h2>✨ Sparkle Shop <span class="bank">💎 <span id="bankCount">0</span></span></h2>
        <div class="shop" id="shop"></div>
        <div id="shopMsg"></div>
      </div>
    </div>
    <button id="startBtn" class="go">Let's Ride! ▶</button>
    <p class="help" id="helpText">🖱️ Move the mouse to steer &nbsp;•&nbsp; SPACE = jump &nbsp;•&nbsp; CLICK = attack</p>
  </div>
</div>

<div id="end" class="overlay hidden">
  <div class="panel" style="max-width:520px">
    <h1 id="endTitle">You did it!</h1>
    <div id="endStars">⭐⭐⭐</div>
    <div id="endStats"></div>
    <div class="row" style="gap:12px">
      <button id="againBtn" class="go">Ride Again! ▶</button>
      <button id="changeBtn" class="go alt">Change Unicorn 🎨</button>
    </div>
  </div>
</div>

<script>
'use strict';
// ---------- palettes ----------
const RAINBOW = ['#ff5e7e','#ffa24c','#ffe14d','#5ed37a','#4cb5ff','#a374ff'];
// the last few in each list are special colors bought in the Sparkle Shop
const FURS = ['#fdfbff','#ffc8e1','#dccbff','#c2e6ff','#c6f3dc','#ffe39a','#4b4463', '#ffa8de','#2a2350','#f5c542'];
const MANES = [RAINBOW, ['#ff5fae','#ff8ec8','#ffc0e0'], ['#8a4dff','#b085ff','#d6c0ff'],
  ['#2f8fff','#6fc0ff','#b8e2ff'], ['#ffae00','#ffd34d','#fff0a3'], ['#1fc495','#62deb8','#b0f0dc'],
  ['#ff6fb5','#ffffff','#7fd3ff','#ffffff'], ['#2a1f6e','#6a4dff','#ff8cc4','#fff6c0'], ['#ff4e4e','#ff9a3c','#ffe14d']];
const ARMORS = ['#c8d0dc','#ffcc3a','#ff8cc4','#5aa6ff','#a47aff','#5ccf86', '#c7f0ff','#3a3560','#f2a6a0'];
const PRICES = { fur:{7:30,8:40,9:30}, mane:{6:35,7:50,8:35}, armor:{6:30,7:40,8:30} };
const SHOP = [
  {id:'trail-sparkle',kind:'trail',val:'sparkle',name:'Sparkle Trail',icon:'✨',price:0},
  {id:'trail-hearts',kind:'trail',val:'hearts',name:'Heart Trail',icon:'💖',price:40},
  {id:'trail-stars',kind:'trail',val:'stars',name:'Star Trail',icon:'⭐',price:40},
  {id:'trail-rainbow',kind:'trail',val:'rainbow',name:'Rainbow Trail',icon:'🌈',price:60},
  {id:'wings',kind:'wings',name:'Unicorn Wings',icon:'🕊️',price:100}];

let cfg = { rider:1, fur:0, mane:0, armor:0, name:'Sparkle', trail:'sparkle', wings:false };
try { const s = JSON.parse(localStorage.getItem('rainbowJoustCfg')); if (s) cfg = Object.assign(cfg, s); } catch(e) {}
function saveCfg(){ try { localStorage.setItem('rainbowJoustCfg', JSON.stringify(cfg)); } catch(e) {} }
// treasure chest: gems saved between rides, and what has been bought
let bank = { gems:0, owned:[] };
try { const b = JSON.parse(localStorage.getItem('rainbowJoustBank')); if (b) bank = Object.assign(bank, b); } catch(e) {}
function saveBank(){ try { localStorage.setItem('rainbowJoustBank', JSON.stringify(bank)); } catch(e) {} }
const owns = id => bank.owned.includes(id);
for (const key of ['fur','mane','armor']) { const p=PRICES[key][cfg[key]]; if (p && !owns(key+cfg[key])) cfg[key]=0; }
if (cfg.trail!=='sparkle' && !owns('trail-'+cfg.trail)) cfg.trail='sparkle';
if (cfg.wings && !owns('wings')) cfg.wings=false;

// ---------- helpers ----------
const rand = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function shade(h,a){ const [r,g,b]=hexToRgb(h), f=a<0?0:255, p=Math.abs(a);
  return `rgb(${Math.round(r+(f-r)*p)},${Math.round(g+(f-g)*p)},${Math.round(b+(f-b)*p)})`; }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function ell(g,x,y,rx,ry,fill){ g.beginPath(); g.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,Math.PI*2); g.fillStyle=fill; g.fill(); }
function heartPath(g,x,y,s){ g.beginPath(); g.moveTo(x,y+s*0.9);
  g.bezierCurveTo(x-s*1.6,y-s*0.2,x-s*0.6,y-s*1.3,x,y-s*0.4);
  g.bezierCurveTo(x+s*0.6,y-s*1.3,x+s*1.6,y-s*0.2,x,y+s*0.9); g.closePath(); }
function crescentPath(g,x,y,r,rot=0){ const A=0.3*Math.PI, c=0.5*r, q=0.814*r, b=1.462;
  g.beginPath(); const cs=Math.cos(rot), sn=Math.sin(rot);
  // outer arc then inner arc (rotated by hand so callers keep their transform)
  for(let i=0;i<=16;i++){ const a=A+(2*Math.PI-2*A)*i/16, px=Math.cos(a)*r, py=Math.sin(a)*r; g.lineTo(x+px*cs-py*sn, y+px*sn+py*cs); }
  for(let i=0;i<=16;i++){ const a=-b-(2*Math.PI-2*b)*i/16, px=c+Math.cos(a)*q, py=Math.sin(a)*q; g.lineTo(x+px*cs-py*sn, y+px*sn+py*cs); }
  g.closePath(); }
function starPath(g,x,y,r,pts=5,inner=0.45,rot=-Math.PI/2){ g.beginPath();
  for(let i=0;i<pts*2;i++){ const rr2=i%2?r*inner:r, a=rot+i*Math.PI/pts; g.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2); } g.closePath(); }

// ---------- sound ----------
let AC=null, muted=false;
function audioInit(){ try { if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); } catch(e){} }
function tone(f,dur,type='sine',vol=0.15,f2=null,delay=0){
  if(!AC||muted) return; const t0=AC.currentTime+delay, o=AC.createOscillator(), gn=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  gn.gain.setValueAtTime(vol,t0); gn.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(gn); gn.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.03); }
const SFX = {
  jump(){ tone(320,0.25,'sine',0.16,760); },
  gem(){ tone(1250,0.08,'triangle',0.1); tone(1680,0.14,'triangle',0.1,null,0.06); },
  star(){ [880,1100,1320,1760].forEach((f,i)=>tone(f,0.12,'triangle',0.11,null,i*0.06)); },
  zap(){ tone(1100,0.18,'sawtooth',0.05,260); tone(1600,0.12,'square',0.025,500); },
  moon(){ tone(1320,0.22,'sine',0.1,1980); tone(990,0.25,'triangle',0.06,1480,0.04); },
  lance(){ tone(480,0.12,'triangle',0.12,950); },
  pow(){ tone(220,0.14,'square',0.08,90); tone(700,0.12,'triangle',0.1,1400,0.05); },
  stomp(){ tone(160,0.12,'square',0.1,320); tone(520,0.1,'triangle',0.08,900,0.06); },
  bonk(){ tone(200,0.3,'sine',0.2,70); },
  whoosh(){ tone(300,0.3,'sawtooth',0.03,120); },
  roar(){ tone(140,0.6,'sawtooth',0.07,80); tone(180,0.5,'square',0.03,90,0.1); },
  win(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,0.25,'triangle',0.12,null,i*0.14)); }
};

// ---------- canvas & view ----------
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
if (isTouch) document.body.classList.add('touch');
let W,H,DPR,horizonY,CX,playerY,S0,CAMH,F; const CAM=5, FAR=70, ROAD=3.1, RUN_TIME=60;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1, isTouch?1.5:2); W=innerWidth; H=innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  horizonY=H*0.36; CX=W/2; playerY=H*(isTouch?0.84:0.88);
  S0=Math.min(H/(H<520?6.2:8.5), W/7.2); CAMH=(playerY-horizonY)/S0; F=S0*CAM;
}
addEventListener('resize',resize); resize();
function proj(x,d,h=0){ const s=F/(d+CAM); return { x:CX+x*s, y:horizonY+CAMH*s-h*s, s }; }

// ---------- drawing: unicorn ----------
function leg(g,cx,top,w,h,col){ rr(g,cx-w/2,top,w,h,w/2); g.fillStyle=col; g.fill();
  rr(g,cx-w/2-1,top+h-10,w+2,11,4); g.fillStyle='#e9b73c'; g.fill(); }
function horn(g,x,y,glow){
  if(glow>0){ const gr=g.createRadialGradient(x+1,y-60,2,x+1,y-60,40);
    gr.addColorStop(0,`rgba(255,255,255,${glow})`); gr.addColorStop(0.4,`rgba(255,180,255,${glow*0.6})`); gr.addColorStop(1,'rgba(255,180,255,0)');
    g.fillStyle=gr; g.fillRect(x-40,y-100,82,80); }
  g.beginPath(); g.moveTo(x-7,y); g.lineTo(x+1,y-60); g.lineTo(x+7,y); g.closePath();
  const gr=g.createLinearGradient(x-7,0,x+7,0); gr.addColorStop(0,'#fff0a0'); gr.addColorStop(1,'#ffb300'); g.fillStyle=gr; g.fill();
  g.strokeStyle='rgba(255,255,255,.85)'; g.lineWidth=2;
  for(let i=1;i<4;i++){ const yy=y-i*14, w=7*(1-(i*14)/60); g.beginPath(); g.moveTo(x-w,yy+3); g.lineTo(x+w,yy-3); g.stroke(); }
}
function lance(g,bx,by,tx,ty,col){
  const ang=Math.atan2(ty-by,tx-bx), len=Math.hypot(tx-bx,ty-by);
  g.save(); g.translate(bx,by); g.rotate(ang);
  g.beginPath(); g.moveTo(0,-8); g.lineTo(len,-1.5); g.lineTo(len,1.5); g.lineTo(0,8); g.closePath();
  g.fillStyle='#ffffff'; g.fill(); g.save(); g.clip(); g.strokeStyle=col; g.lineWidth=9;
  for(let s=12;s<len;s+=28){ g.beginPath(); g.moveTo(s,-10); g.lineTo(s+12,10); g.stroke(); } g.restore();
  g.strokeStyle='rgba(90,44,168,.25)'; g.lineWidth=1.5; g.stroke();
  ell(g,8,0,6,16,'#ffd34d'); g.restore();
}
function shieldDraw(g,x,y,A,heart){
  g.beginPath(); g.moveTo(x-18,y-22); g.lineTo(x+18,y-22); g.lineTo(x+18,y); g.quadraticCurveTo(x+16,y+18,x,y+28);
  g.quadraticCurveTo(x-16,y+18,x-18,y); g.closePath(); g.fillStyle=A; g.fill(); g.lineWidth=3; g.strokeStyle=shade(A,-0.3); g.stroke();
  heartPath(g,x,y+1,9); g.fillStyle=heart; g.fill();
}
// draws a unicorn seen from behind; 100 local units = 1 world unit. returns horn tip in screen coords.
function drawUnicorn(g,x,y,u,o){
  const k=u/100, t=o.t, fur=o.fur, furD=shade(fur,-0.2), furL=shade(fur,0.4), mane=o.mane;
  const gal=o.air?0:Math.sin(t*14), bob=o.air?0:-Math.abs(Math.cos(t*14))*4;
  g.save(); g.translate(x,y); g.rotate(o.tilt||0); g.scale(k,k); g.lineCap='round';
  // front legs (further away)
  leg(g,-14,-55+bob,13,o.air?38:50+gal*5-bob,furD); leg(g,14,-55+bob,13,o.air?38:50-gal*5-bob,furD);
  // neck, head, horn, ears
  const hx=o.rider?-24:0, hy=(o.rider?-160:-150)+bob;
  ell(g,hx*0.55,-112+bob,21,32,fur);
  for(const s of [-1,1]){ g.beginPath(); g.moveTo(hx+s*8,hy-18); g.lineTo(hx+s*20,hy-44); g.lineTo(hx+s*25,hy-12); g.closePath(); g.fillStyle=fur; g.fill();
    g.beginPath(); g.moveTo(hx+s*12,hy-18); g.lineTo(hx+s*19,hy-36); g.lineTo(hx+s*21,hy-16); g.closePath(); g.fillStyle='#ffb3cf'; g.fill(); }
  horn(g,hx,hy-20,o.glow||0);
  ell(g,hx,hy,26,28,fur);
  const sway=Math.sin(t*7)*5, n=mane.length;
  mane.forEach((c,i)=>{ const off=(i-(n-1)/2)*(26/n); g.strokeStyle=c; g.lineWidth=Math.max(6,30/n);
    g.beginPath(); g.moveTo(hx+off*0.6,hy-22); g.bezierCurveTo(hx+off+sway,hy+12,hx*0.4+off*0.8-sway,-122+bob,off*0.9+sway*0.5,-100+bob); g.stroke(); });
  // back legs
  const bl=o.air?52:70-bob-Math.max(0,gal)*14, br=o.air?52:70-bob-Math.max(0,-gal)*14;
  leg(g,-30,-70+bob,20,bl,fur); leg(g,30,-70+bob,20,br,fur);
  // body (rump)
  ell(g,0,-80+bob,52,40,fur);
  g.globalAlpha=0.6; ell(g,-15,-97+bob,22,10,furL); g.globalAlpha=1;
  g.strokeStyle=furD; g.lineWidth=2; g.beginPath(); g.moveTo(0,-94+bob); g.quadraticCurveTo(3,-70+bob,0,-46+bob); g.stroke();
  // wings (Sparkle Shop)
  if(o.wings){
    const fl=Math.sin(t*(o.air?18:7))*(o.air?0.4:0.15);
    for(const s of [-1,1]){ g.save(); g.translate(s*34,-104+bob); g.scale(s,1); g.rotate(-0.3+fl);
      g.beginPath(); g.moveTo(0,8); g.quadraticCurveTo(30,-70,100,-66); g.quadraticCurveTo(86,-50,94,-40); g.quadraticCurveTo(70,-32,80,-20);
      g.quadraticCurveTo(52,-14,58,0); g.quadraticCurveTo(28,2,0,14); g.closePath();

let mode='menu', paused=false, G=null;
function newGame(){

const isEnemy=o=>o.type==='goblin'||o.type==='troll'||o.type==='slime';
function add(o){ o.t=o.t||0; o.ph=Math.random()*6; G.objs.push(o); return o; }
function spawnScenery(d){
  const side=Math.random()<0.5?-1:1, r=Math.random();
  if(r<0.3) add({type:'tree',x:side*rand(4.6,9),d,col:['#7fd36b','#ffb3d9','#9fe08a','#c7a6ff'][Math.floor(Math.random()*4)],fruit:Math.random()<0.4?'#ff5e7e':null,sz:rand(0.9,1.3)});
  else add({type:'flower',x:side*rand(3.7,7),d,col:RAINBOW[Math.floor(Math.random()*6)],sz:rand(0.8,1.3)});
}
function gemCol(){ return ['#ff5fae','#4cb5ff','#5ed37a','#a374ff','#ffa24c'][Math.floor(Math.random()*5)]; }
function spawnPattern(){
  const t=G.t, X=()=>rand(-2.3,2.3);
  const opts = t<10 ? [['gemLine',4],['rock',2],['goblin',1.5],['star',0.5]]
    : [['gemLine',3],['gemWave',2],['rock',2],['log',1.4],['goblin',3],['slime',2],['troll',0.8+t/40],['pair',t>25?1.5:0],['star',0.8],['gemRock',1.2]];
  let tot=opts.reduce((a,o)=>a+o[1],0), r=Math.random()*tot, pick=opts[0][0];
  for(const [n,w] of opts){ if((r-=w)<=0){ pick=n; break; } }
  const D=FAR;
  switch(pick){
    case 'gemLine': { const x=X(); for(let i=0;i<5;i++) add({type:'gem',x,d:D+i*2.2,w:0.25,col:gemCol()}); break; }
    case 'gemWave': { const x0=X(); for(let i=0;i<7;i++) add({type:'gem',x:clamp(x0+Math.sin(i*0.8)*1.3,-2.5,2.5),d:D+i*2,w:0.25,col:gemCol()}); break; }
    case 'gemRock': { const x=X(); add({type:'rock',x,d:D,w:0.45}); for(let i=1;i<=3;i++) add({type:'gem',x,d:D+i*1.6,w:0.25,col:gemCol()}); break; }
    case 'rock': add({type:'rock',x:X(),d:D,w:0.45}); break;
    case 'log': add({type:'log',x:rand(-1.8,1.8),d:D,w:0.75}); break;
    case 'star': add({type:'star',x:X(),d:D,w:0.3}); break;
    case 'goblin': { const x=X(); add({type:'goblin',x,bx:x,d:D,w:0.4,hp:1}); break; }
    case 'slime': add({type:'slime',x:X(),d:D,w:0.4,hp:1,h:0}); break;
    case 'troll': add({type:'troll',x:X(),d:D,w:0.55,hp:2}); break;
    case 'pair': { const a=rand(-2.3,-0.6), b=rand(0.6,2.3); add({type:'goblin',x:a,bx:a,d:D,w:0.4,hp:1}); add({type:Math.random()<0.5?'slime':'goblin',x:b,bx:b,d:D+3,w:0.4,hp:1,h:0}); break; }
  }
}

// ---------- effects ----------
function addP(x,y,o){ G.parts.push(Object.assign({x,y,vx:0,vy:0,life:0.8,max:0.8,size:6,color:'#fff',g:0,shape:'spark',rot:Math.random()*6},o)); }
function poof(x,y,sc=1){
  for(let i=0;i<14;i++){ const a=Math.random()*Math.PI*2, v=rand(120,340)*sc; addP(x,y,{vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:0.7,max:0.7,size:rand(6,12)*sc,color:RAINBOW[i%6],g:300}); }
  for(let i=0;i<6;i++){ const a=Math.random()*Math.PI*2; addP(x,y,{vx:Math.cos(a)*60,vy:Math.sin(a)*60,life:0.5,max:0.5,size:rand(16,28)*sc,color:'#ffffff',shape:'circle'}); }
}
function say(text,x,y,o={}){ G.texts.push(Object.assign({text,x:x??CX,y:y??H*0.3,life:1.2,max:1.2,size:44,color:'#ff5fae'},o)); }
function playerScreen(){ return { x:CX+G.px*S0, y:playerY-G.jz*S0 }; }

// ---------- actions ----------
function jump(){ if(mode!=='play'||paused||G.air||G.phase==='win') return; G.air=true; G.vz=7.6; SFX.jump(); }
function attack(){
  if(mode!=='play'||paused||G.cd>0||G.phase==='win') return;
  G.atkT=0;
  if(cfg.rider===2){
    G.cd=0.3; SFX.moon(); G.glow=1;
    let tx=null, bd=99;
    for(const o of G.objs) if(((isEnemy(o)&&!o.done)||(o.type==='fire'&&!o.ref))&&!o.dead&&o.d>0&&o.d<30&&Math.abs(o.x-G.px)<1.6&&o.d<bd){ bd=o.d; tx=o.x; }
    const lead = tx===null && G.boss && !G.boss.happy;
    G.zaps.push({x:G.px,x0:G.px,tx:tx===null?(lead?G.boss.x:G.px):tx,d:0.8,life:0,moon:true,lead});
  } else if(cfg.rider===1){
    G.cd=0.32; SFX.lance();
    let best=null;
    for(const o of G.objs){
      if(o.dead) continue;
      const ok = (isEnemy(o)&&!o.done) || (o.type==='fire'&&!o.ref);
      if(ok && o.d>-0.4 && o.d<8 && Math.abs(o.x-G.px)<o.w+0.75 && (!best||o.d<best.d)) best=o;
    }
    if(best){ if(best.type==='fire') reflect(best); else hitEnemy(best,'POW!'); }
    else if(G.boss&&!G.boss.happy&&G.boss.d<30){
      // the dragon is too far for the lance, so the lance tip shoots a sparkle star at him
      G.zaps.push({x:G.px,x0:G.px,tx:G.boss.x,d:1.2,life:0,star:true,lead:true});
    }
  } else {
    G.cd=0.26; SFX.zap(); G.glow=1;
    let tx=G.px, bd=99;
    for(const o of G.objs) if(isEnemy(o)&&!o.dead&&!o.done&&o.d>0&&o.d<30&&Math.abs(o.x-G.px)<1.2&&o.d<bd){ bd=o.d; tx=o.x; }
    G.zaps.push({x:G.px,x0:G.px,tx,d:0.8,life:0});
  }
}
function hitEnemy(o,word){
  const p=proj(o.x,o.d,0.6);
  if(o.type==='troll'&&o.hp>1){ o.hp--; o.hurt=0.35; o.d+=2.5; SFX.pow(); say('Ouch!',p.x,p.y-40,{size:30,color:'#5aa6ff',life:0.8,max:0.8}); return; }
  o.dead=true; G.poofs++; G.gems+=2; G.gemPulse=0.3; SFX.pow();
  poof(p.x,p.y,clamp(p.s/S0,0.4,1.2));
  say(word,p.x,p.y-30,{size:38,color:word==='ZAP!'?'#a374ff':'#ff5fae',life:0.8,max:0.8});
}
function reflect(o){
  o.ref=true; o.done=true; const p=proj(o.x,o.d,o.h);
  say(['Zapped back!','Take that!','Moon magic!'][cfg.rider],p.x,p.y-30,{size:28,color:'#ff9a3c',life:0.8,max:0.8});
  SFX.lance();
}
function bonk(){
  if(G.inv>0) return;
  G.inv=1.6; G.stun=0.5; G.bonks++; G.shake=0.3; SFX.bonk();
  const n=Math.min(3,G.gems); G.gems-=n; const ps=playerScreen();
  for(let i=0;i<n;i++) addP(ps.x,ps.y-S0,{vx:rand(-260,260),vy:rand(-380,-220),g:700,life:1,max:1,size:10,shape:'gem',color:gemCol()});
  say('Oof!',ps.x,ps.y-S0*2.6,{size:40,color:'#5aa6ff',life:0.9,max:0.9});
}
function touchObj(o){
  const dx=Math.abs(o.x-G.px), reach=o.w+0.42, ps=playerScreen();
  if(o.type==='gem'){ if(dx<reach+0.15){ o.dead=true; G.gems++; G.gemPulse=0.25; SFX.gem();
      for(let i=0;i<6;i++) addP(ps.x+(o.x-G.px)*S0,ps.y-S0*0.6,{vx:rand(-120,120),vy:rand(-200,-60),size:7,color:o.col,life:0.5,max:0.5}); } }
  else if(o.type==='star'){ if(dx<reach+0.15){ o.dead=true; G.gems+=5; G.gemPulse=0.4; SFX.star(); say('+5 ⭐',ps.x,ps.y-S0*2.6,{size:36,color:'#ffae00'}); } }
  else if(o.type==='rock'||o.type==='log'){ if(dx<reach){ if(G.jz>0.4){ if(Math.random()<0.4) say(['Wheee!','Boing!','Yay!'][Math.floor(Math.random()*3)],ps.x,ps.y-S0*2.6,{size:32,color:'#5ed37a',life:0.8,max:0.8}); } else bonk(); } }
  else if(isEnemy(o)){ if(dx<reach){ if(G.jz>0.3){ SFX.stomp(); G.vz=Math.max(G.vz,4); hitEnemy(o,'Hoof Bonk!'); o.dead=true; } else bonk(); } }
}
function hurtBoss(){
  const b=G.boss; if(!b||b.happy) return;
  b.hp--; b.hurt=0.5; SFX.pow(); G.shake=0.2;
  const p=proj(b.x,b.d,b.h+3.5); poof(p.x,p.y,1.3); say('POW!',p.x,p.y-40,{size:54});
  if(b.hp<=0){ b.happy=true; G.phase='win'; G.phaseT=0; G.gems+=10; SFX.win();
    for(const o of G.objs) if(o.type==='fire') o.dead=true;
    say('Grumbly wants to be friends! 💜',CX,H*0.25,{size:Math.min(40,W/16),life:4,max:4,color:'#a374ff'}); }
}

// ---------- update ----------
const keys={left:false,right:false};
let pointerX=null, pointerMoved=false;
function update(dt){
  const demo = mode!=='play';
  G.t+=dt; G.phaseT+=dt;
  let target = demo ? 9 : Math.min(19, 12.5+G.t*0.1);
  if(G.phase==='boss'||G.phase==='prebs') target=15;
  if(G.phase==='win') target=8;
  if(G.stun>0) target*=0.45;
  G.speed+=(target-G.speed)*Math.min(1,dt*3);
  const mv=G.speed*dt; G.scroll+=mv;

  if(demo) G.tx=Math.sin(G.t*0.5)*1.2;
  else {
    if(keys.left) G.tx-=5.5*dt; if(keys.right) G.tx+=5.5*dt;
    if(pointerMoved&&pointerX!==null){ G.tx=(pointerX-CX)/S0; pointerMoved=false; }
    G.tx=clamp(G.tx,-2.6,2.6);
  }
  const prev=G.px; G.px+=(G.tx-G.px)*Math.min(1,dt*8); G.vx=(G.px-prev)/Math.max(dt,1e-4);
  if(G.air){ G.vz-=21*dt; G.jz+=G.vz*dt; if(G.jz<=0){ G.jz=0; G.air=false; G.vz=0; const ps=playerScreen();
    for(let i=0;i<6;i++) addP(ps.x+rand(-30,30),ps.y,{vx:rand(-90,90),vy:rand(-50,-10),size:rand(10,16),color:'rgba(240,220,190,.8)',shape:'circle',life:0.4,max:0.4}); } }
  G.atkT+=dt; G.cd-=dt; G.inv-=dt; G.stun-=dt; G.shake-=dt; G.gemPulse-=dt; G.glow=Math.max(0,G.glow-dt*4);

  // sparkle trail
  G.trailT-=dt;
  if(G.trailT<=0){ G.trailT=0.05; const ps=playerScreen(), k=S0/100; const m=MANES[cfg.mane];
    const px=ps.x+rand(-12,12)*k, py=ps.y-40*k;
    if(cfg.trail==='hearts'){ G.trailT=0.08; addP(px,py,{vx:rand(-40,40),vy:rand(50,110),size:rand(7,11)*k*1.4,color:['#ff5fae','#ff8ec8','#ff3d7f'][Math.floor(Math.random()*3)],shape:'heart',life:0.8,max:0.8}); }
    else if(cfg.trail==='stars'){ G.trailT=0.07; addP(px,py,{vx:rand(-40,40),vy:rand(50,120),size:rand(8,12)*k*1.4,color:['#ffe14d','#fff6a8','#ffae00'][Math.floor(Math.random()*3)],shape:'star5',life:0.8,max:0.8}); }
    else if(cfg.trail!=='rainbow') addP(px,py,{vx:rand(-30,30),vy:rand(40,120),size:rand(4,8)*k*1.4,color:m[Math.floor(Math.random()*m.length)],life:0.6,max:0.6}); }
  // rainbow trail: remember where the unicorn has been so a ribbon can be laid on the road
  G.hist.push({x:G.px,s:G.scroll});
  while(G.hist.length>2 && G.hist[0].s-G.scroll < -CAM+0.6) G.hist.shift();

  for(const o of G.objs){
    o.t+=dt; if(o.hurt) o.hurt-=dt;
    if(o.type==='fire'){ updFire(o,dt); continue; }
    o.d-=mv;
    if(o.type==='goblin') o.x=o.bx+Math.sin(o.t*2.2+o.ph)*0.45;
    if(o.type==='slime') o.h=Math.abs(Math.sin(o.t*5))*0.3;
    if(!demo && !o.done && o.type!=='tree' && o.type!=='flower' && o.d<=0.25){ o.done=true; touchObj(o); }
    if(o.d < ((o.type==='tree'||o.type==='flower')?-3:-1.2)) o.dead=true;
  }

  if(!demo){
    if(G.phase==='run'){
      G.spawnT-=dt;
      if(G.spawnT<=0){ spawnPattern(); G.spawnT=rand(1.0,1.5)-Math.min(0.35,G.t/160); }
      if(G.t>=RUN_TIME){ G.phase='prebs'; G.phaseT=0; SFX.roar(); say('Look out! A grumbly dragon!',CX,H*0.25,{size:Math.min(42,W/15),life:2.5,max:2.5,color:'#a374ff'}); }
    } else if(G.phase==='prebs'){
      if(G.phaseT>2.6){ G.phase='boss'; G.phaseT=0; G.spawnT=2;
        G.boss={x:0,d:FAR+5,h:1.6,hp:8,max:8,t:0,shootT:2.5,hurt:0,happy:false};
        say(['Zap Grumbly with rainbow lightning!','Click to throw lance stars at Grumbly!','Cast moon magic at Grumbly!'][cfg.rider],CX,H*0.5,{size:Math.min(32,W/20),life:3.5,max:3.5,color:'#5a2ca8'}); }
    } else if(G.phase==='boss'){
      G.spawnT-=dt; if(G.spawnT<=0){ const x=rand(-2.3,2.3); for(let i=0;i<4;i++) add({type:'gem',x,d:FAR+i*2.2,w:0.25,col:gemCol()}); G.spawnT=3.5; }
    } else if(G.phase==='win'){
      if(Math.random()<dt*20) addP(rand(0,W),-10,{vx:rand(-40,40),vy:rand(120,220),size:rand(6,10),color:RAINBOW[Math.floor(Math.random()*6)],life:3,max:3,shape:'confetti'});
      if(G.phaseT>4.5 && !G.ended){ G.ended=true; showEnd(); }
    }
    if(G.boss) updBoss(dt);
  }
  G.sceneT-=dt;
  if(G.sceneT<=0){ spawnScenery(FAR+rand(0,2)); G.sceneT=0.1*(14/Math.max(G.speed,5)); }

  for(const z of G.zaps){
    z.life+=dt; z.d+=50*dt; if(z.lead&&G.boss) z.tx=G.boss.x; z.x+=(z.tx-z.x)*Math.min(1,dt*7);
    for(const o of G.objs){
      if(o.dead) continue;
      if(isEnemy(o)&&!o.done&&Math.abs(o.d-z.d)<1.4&&Math.abs(o.x-z.x)<o.w+0.4){ hitEnemy(o,z.moon?'Sparkle!':z.star?'POW!':'ZAP!'); z.dead=true; break; }
      if(o.type==='fire'&&!o.ref&&Math.abs(o.d-z.d)<1.6&&Math.abs(o.x-z.x)<0.8){ reflect(o); z.dead=true; break; }
    }
    const b=G.boss;
    if(!z.dead&&b&&!b.happy&&z.d>=b.d-1&&Math.abs(z.x-b.x)<2.6){ hurtBoss(); z.dead=true; }
    if(z.d>55) z.dead=true;
  }
  G.zaps=G.zaps.filter(z=>!z.dead);
  G.objs=G.objs.filter(o=>!o.dead);
  for(const p of G.parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; p.rot+=dt*4; }
  G.parts=G.parts.filter(p=>p.life>0);
  if(G.parts.length>400) G.parts.splice(0,G.parts.length-400);
  for(const t of G.texts){ t.life-=dt; t.y-=40*dt; }
  G.texts=G.texts.filter(t=>t.life>0);
  for(const c of G.clouds){ c.x-=c.v*dt; if(c.x<-0.2) c.x=1.2; }
  if(isNight()&&Math.random()<dt*8){ // fireflies
    const sd=Math.random()<0.5?-1:1; addP(CX+sd*rand(0.55,1)*W*0.5,rand(horizonY+H*0.1,H*0.95),{vx:rand(-15,15),vy:rand(-25,-8),size:rand(2.5,4.5),color:'#fff59a',shape:'circle',life:2.2,max:2.2}); }
}
function updBoss(dt){
  const b=G.boss; b.t+=dt; b.hurt-=dt;
  if(!b.happy){
    b.d+=(20-b.d)*Math.min(1,dt*1.2); b.x=Math.sin(b.t*0.55)*2.1; b.h=1.6+Math.sin(b.t*2)*0.3;
    b.shootT-=dt;
    if(b.shootT<=0&&b.d<24){ const h0=b.h+5; add({type:'fire',x:b.x,d:b.d-1,d0:b.d-1,h0,h:h0,tx:G.px+rand(-0.3,0.3),ref:false,w:0.35}); SFX.whoosh(); b.shootT=1.5+b.hp*0.12; }
  } else {
    b.h+=dt*1.2; b.d+=dt*3; b.x*=0.98;
    if(Math.random()<dt*6){ const p=proj(b.x,b.d,b.h+5); addP(p.x+rand(-60,60),p.y,{vy:-60,size:14,color:'#ff6fb5',shape:'heart',life:1.5,max:1.5}); }
  }
}
function updFire(o,dt){
  if(!o.ref){
    o.d-=15*dt; o.x+=(o.tx-o.x)*Math.min(1,dt*1.5); o.h=0.7+(o.h0-0.7)*Math.max(0,o.d/o.d0);
    if(!o.done&&o.d<=0.25){ o.done=true; if(Math.abs(o.x-G.px)<0.6&&G.jz<0.75){ bonk(); o.dead=true; const p=proj(o.x,0.2,0.7); poof(p.x,p.y,0.6); } }
    if(o.d<-1.2) o.dead=true;
  } else {
    const b=G.boss; if(!b){ o.dead=true; return; }
    o.d+=34*dt; o.x+=(b.x-o.x)*Math.min(1,dt*6); o.h=0.7+(b.h+3-0.7)*Math.min(1,o.d/b.d);
    if(o.d>=b.d-0.5){ o.dead=true; hurtBoss(); }
  }
}

// ---------- render ----------
const isNight=()=>cfg.rider===2;
function drawSky(){
  const night=isNight();
  const gr=ctx.createLinearGradient(0,0,0,horizonY);
  gr.addColorStop(0,night?'#1b1f5e':'#8fd3ff'); gr.addColorStop(1,night?'#8a64c4':'#ffe0f2');
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,horizonY+2);
  const sx=W*0.85, sy=H*0.1, sr=Math.min(W,H)*0.06;
  if(night){
    for(let i=0;i<60;i++){ const x=((i*137.5)%100)/100*W, y=((i*61.8)%100)/100*horizonY*0.95;
      ctx.globalAlpha=0.45+0.45*Math.sin(G.t*2+i*1.7); starPath(ctx,x,y,1.5+(i%3),4,0.4); ctx.fillStyle='#fff'; ctx.fill(); }
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(220,225,255,.25)'; ctx.beginPath(); ctx.arc(sx,sy,sr*1.6,0,7); ctx.fill();
    crescentPath(ctx,sx,sy,sr,-0.5); ctx.fillStyle='#f4f5ff'; ctx.fill();
  } else {
    ctx.fillStyle='rgba(255,240,150,.5)'; ctx.beginPath(); ctx.arc(sx,sy,sr*1.5,0,7); ctx.fill();
    ell(ctx,sx,sy,sr,sr,'#ffe866');
  }
  for(const c of G.clouds){ const x=c.x*W, y=c.y*H, r=Math.min(W,H)*0.05*c.s;
    ctx.fillStyle=night?'rgba(200,190,255,.28)':'rgba(255,255,255,.92)'; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.arc(x+r*0.9,y+r*0.2,r*0.8,0,7); ctx.arc(x-r*0.9,y+r*0.25,r*0.7,0,7); ctx.arc(x+r*0.2,y+r*0.4,r*0.8,0,7); ctx.fill(); }
  // hills
  const par=-G.px*8;
  const hillCols=night?['#4b5f9a','#3d6f7a']:['#c3ecb5','#a9e298'];
  for(const [col,amp,off,ph] of [[hillCols[0],H*0.05,0,0],[hillCols[1],H*0.035,H*0.012,2]]){
    ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,horizonY+2);
    for(let x=0;x<=W+20;x+=20) ctx.lineTo(x,horizonY-off-Math.abs(Math.sin((x+par*(1+ph*0.3))/(W*0.18)+ph))*amp);
    ctx.lineTo(W,horizonY+2); ctx.fill(); }
  const prog = G.phase==='run'? Math.min(1,G.t/RUN_TIME) : 1;
  drawCastle(ctx,CX-G.px*4,horizonY+1,(H/500)*(0.35+prog*0.55));
}
function drawGround(){
  ctx.fillStyle='#93dc7e'; ctx.fillRect(0,horizonY,W,H-horizonY);
  const pb=proj(0,-CAM+0.4);
  ctx.fillStyle='#fff0d6'; ctx.beginPath(); ctx.moveTo(CX,horizonY); ctx.lineTo(CX+ROAD*pb.s,pb.y); ctx.lineTo(CX-ROAD*pb.s,pb.y); ctx.fill();
  const L=2.4, off=G.scroll%(6*L), N=Math.ceil((FAR+6*L)/L)+2;
  for(let i=0;i<N;i++){
    let d0=i*L-off-L*2, d1=d0+L;
    if(d1<-CAM+0.4||d0>FAR) continue; d0=Math.max(d0,-CAM+0.4);
    const a=proj(0,d0), b=proj(0,d1), y0=Math.min(a.y,H+5), y1=b.y;
    if(i%2){ ctx.fillStyle='#88d473'; ctx.fillRect(0,y1,W,y0-y1+1); }
    ctx.fillStyle=i%2?'#ffe8c4':'#fff3dc';
    ctx.beginPath(); ctx.moveTo(CX-ROAD*b.s,y1); ctx.lineTo(CX+ROAD*b.s,y1); ctx.lineTo(CX+ROAD*a.s,a.y); ctx.lineTo(CX-ROAD*a.s,a.y); ctx.fill();
    ctx.fillStyle=RAINBOW[((i%6)+6)%6];
    for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(CX+s*ROAD*b.s,y1); ctx.lineTo(CX+s*(ROAD+0.3)*b.s,y1); ctx.lineTo(CX+s*(ROAD+0.3)*a.s,a.y); ctx.lineTo(CX+s*ROAD*a.s,a.y); ctx.fill(); }
  }
  if(isNight()){ ctx.fillStyle='rgba(30,25,100,.38)'; ctx.fillRect(0,horizonY,W,H-horizonY); }
  const hc=isNight()?'140,110,200':'255,230,245';
  const hz=ctx.createLinearGradient(0,horizonY,0,horizonY+H*0.08); hz.addColorStop(0,`rgba(${hc},.8)`); hz.addColorStop(1,`rgba(${hc},0)`);
  ctx.fillStyle=hz; ctx.fillRect(0,horizonY,W,H*0.08);
}
function drawObj(o){
  if(o.d+CAM<0.4) return;
  const p=proj(o.x,o.d), s=p.s;
  ctx.globalAlpha=clamp((FAR+3-o.d)/8,0,1);
  if(o.type!=='tree'&&o.type!=='flower'&&o.type!=='fire') ell(ctx,p.x,p.y,o.w*s*1.1,o.w*s*0.28,'rgba(60,30,100,.15)');
  switch(o.type){
    case 'tree': drawTree(ctx,p.x,p.y,s*o.sz,o); break;
    case 'flower': drawFlower(ctx,p.x,p.y,s*o.sz,o); break;
    case 'rock': drawRock(ctx,p.x,p.y,s); break;
    case 'log': drawLog(ctx,p.x,p.y,s); break;
    case 'goblin': drawGoblin(ctx,p.x,p.y,s*0.95,o); break;
    case 'slime': drawSlime(ctx,p.x,p.y-(o.h||0)*s,s*0.95,o); break;
    case 'troll': drawTroll(ctx,p.x,p.y,s*0.95,o); break;
    case 'gem': drawGem(ctx,p.x,p.y-(0.5+Math.sin(o.t*4+o.ph)*0.08)*s,0.26*s,o); break;
    case 'star': drawStar(ctx,p.x,p.y-(0.6+Math.sin(o.t*4)*0.1)*s,0.36*s,o.t); break;
    case 'fire': { ell(ctx,p.x,p.y,0.35*s,0.1*s,'rgba(60,30,100,.12)'); drawFire(ctx,p.x,p.y-o.h*s,Math.max(0.45*s,7),o); break; }
    case 'boss': { const b=G.boss, bp=proj(b.x,b.d); ell(ctx,bp.x,bp.y,2.2*bp.s,0.4*bp.s,'rgba(60,30,100,.18)'); drawDragon(ctx,bp.x,bp.y-b.h*bp.s,bp.s*3.5,b); break; }
  }
  ctx.globalAlpha=1;
}
function drawPlayer(){
  const ps=playerScreen(), k=S0/100;
  ell(ctx,ps.x,playerY,55*k*(1-Math.min(0.5,G.jz*0.25)),13*k,'rgba(60,30,100,.18)');
  if(G.inv>0&&Math.floor(G.inv*12)%2) ctx.globalAlpha=0.45;
  const atk=G.atkT<0.25?Math.sin(Math.PI*G.atkT/0.25):0;
  G.horn=drawUnicorn(ctx,ps.x,ps.y,S0,{fur:FURS[cfg.fur],mane:MANES[cfg.mane],armor:ARMORS[cfg.armor],rider:cfg.rider,wings:cfg.wings,
    t:G.t,air:G.air,atk,tilt:clamp(G.vx*0.025,-0.18,0.18),glow:G.glow});
  ctx.globalAlpha=1;
}
function drawZaps(){
  const hAt=d=>0.6+1.7*Math.max(0,1-d/8);
  for(const z of G.zaps){
    if(z.moon){ const hz=d=>0.7+1.6*Math.max(0,1-d/8);
      const p=z.d<1.5&&G.horn?{x:G.horn.x+(proj(z.x,z.d,hz(z.d)).x-G.horn.x)*(z.d/1.5),y:G.horn.y+(proj(z.x,z.d,hz(z.d)).y-G.horn.y)*(z.d/1.5),s:proj(z.x,z.d).s}:proj(z.x,z.d,hz(z.d));
      const r=Math.max(9,p.s*0.42);
      for(let i=1;i<=5;i++){ const dd=Math.max(0,z.d-i*1.1), q=proj(z.x0+(z.x-z.x0)*(dd/Math.max(z.d,0.01)),dd,hz(dd)); ctx.globalAlpha=0.7-i*0.12;
        starPath(ctx,q.x,q.y,Math.max(3,r*0.35),4,0.35,z.life*9+i); ctx.fillStyle=['#ffffff','#cdd6ff','#ffe866','#b7a4ff','#ffffff'][i-1]; ctx.fill(); }
      ctx.globalAlpha=1;
      const gr=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,r*1.8); gr.addColorStop(0,'rgba(230,235,255,.9)'); gr.addColorStop(1,'rgba(160,170,255,0)');
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(p.x,p.y,r*1.8,0,7); ctx.fill();
      crescentPath(ctx,p.x,p.y,r,z.life*7); ctx.fillStyle='#f4f5ff'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#b7a4ff'; ctx.stroke();
      continue; }
    if(z.star){ const p=proj(z.x,z.d,0.6+2.2*Math.min(1,z.d/18)), r=Math.max(8,p.s*0.45);
      for(let i=1;i<=4;i++){ const q=proj(z.x,z.d-i*1.2,0.6+2.2*Math.min(1,Math.max(0,z.d-i*1.2)/18)); ctx.globalAlpha=0.5-i*0.1;
        starPath(ctx,q.x,q.y,r*(1-i*0.15),4,0.35,z.life*8); ctx.fillStyle=RAINBOW[i%6]; ctx.fill(); }
      ctx.globalAlpha=1; starPath(ctx,p.x,p.y,r,5,0.48,z.life*10); ctx.fillStyle='#ffe14d'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
      continue; }
    const head=proj(z.x,z.d,hAt(z.d)), tailD=z.d-7;
    const tail = tailD<=0.8 ? G.horn : proj(z.x0+(z.x-z.x0)*0.5,tailD,hAt(tailD));
    const seg=9, pts=[];
    for(let i=0;i<=seg;i++){ const f=i/seg, jit=(i===0||i===seg)?0:rand(-1,1)*Math.max(4,head.s*0.12);
      pts.push([tail.x+(head.x-tail.x)*f+jit, tail.y+(head.y-tail.y)*f+jit*0.4]); }
    ctx.lineCap='round'; ctx.lineJoin='round';
    const cols=[RAINBOW[Math.floor(z.life*20)%6],RAINBOW[(Math.floor(z.life*20)+2)%6],'#ffffff'];
    [10,6,2.5].forEach((lw,i)=>{ ctx.strokeStyle=cols[i]; ctx.lineWidth=lw*Math.max(0.6,S0/90); ctx.beginPath(); pts.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); });
    const r=Math.max(5,head.s*0.25); const gr=ctx.createRadialGradient(head.x,head.y,1,head.x,head.y,r*2);
    gr.addColorStop(0,'#fff'); gr.addColorStop(0.4,'rgba(255,170,255,.8)'); gr.addColorStop(1,'rgba(255,170,255,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(head.x,head.y,r*2,0,7); ctx.fill();
  }
}
function drawParts(){
  for(const p of G.parts){
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    if(p.shape==='circle') ell(ctx,p.x,p.y,p.size,p.size,p.color);
    else if(p.shape==='gem') drawGem(ctx,p.x,p.y,p.size,{t:p.rot,ph:0,col:p.color});
    else if(p.shape==='star5'){ starPath(ctx,p.x,p.y,p.size,5,0.48,p.rot); ctx.fillStyle=p.color; ctx.fill(); }
    else if(p.shape==='heart'){ heartPath(ctx,p.x,p.y,p.size); ctx.fillStyle=p.color; ctx.fill(); }
    else if(p.shape==='confetti'){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2); ctx.restore(); }
    else { starPath(ctx,p.x,p.y,p.size,4,0.35,p.rot); ctx.fillStyle=p.color; ctx.fill(); }
  }
  ctx.globalAlpha=1;
}
function drawTexts(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const t of G.texts){
    const a=clamp(t.life/t.max*2,0,1), pop=1+Math.max(0,(t.life-t.max+0.15))*3;
    ctx.globalAlpha=a; ctx.font=`700 ${t.size*pop}px Fredoka, 'Trebuchet MS', sans-serif`;
    ctx.lineWidth=t.size*0.16; ctx.strokeStyle='#fff'; ctx.strokeText(t.text,t.x,t.y); ctx.fillStyle=t.color; ctx.fillText(t.text,t.x,t.y);
  }
  ctx.globalAlpha=1;
}
function hudText(txt,x,y,size,col,align='left'){ ctx.font=`700 ${size}px Fredoka, 'Trebuchet MS', sans-serif`; ctx.textAlign=align; ctx.textBaseline='middle';
  ctx.lineWidth=size*0.18; ctx.strokeStyle='#fff'; ctx.strokeText(txt,x,y); ctx.fillStyle=col; ctx.fillText(txt,x,y); }
function drawHUD(){
  if(mode!=='play'&&mode!=='end') return;
  const sc=1+Math.max(0,G.gemPulse)*1.2;
  rr(ctx,12,12,140,52,18); ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fill();
  drawGem(ctx,40,38,15*sc,{t:G.t,ph:0,col:'#ff5fae'});
  hudText(String(G.gems),66,39,30*sc,'#7a3cff');
  const bw=Math.min(380,W-300), bx=CX-bw/2, by=26;
  if(bw>80){
    if(G.phase==='run'||G.phase==='prebs'){
      const prog=Math.min(1,G.t/RUN_TIME);
      rr(ctx,bx,by,bw,22,11); ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fill();
      rr(ctx,bx+3,by+3,Math.max(16,(bw-6)*prog),16,8); const gr=ctx.createLinearGradient(bx,0,bx+bw,0);
      RAINBOW.forEach((c,i)=>gr.addColorStop(i/5,c)); ctx.fillStyle=gr; ctx.fill();
      ctx.font='26px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🦄',bx+(bw-6)*prog+3,by+11); ctx.fillText('🏰',bx+bw+20,by+9);
    } else if(G.boss){
      const b=G.boss; hudText('Grumbly',CX,by+2,22,'#7a3cff','center');
      for(let i=0;i<b.max;i++){ heartPath(ctx,CX-(b.max-1)*14+i*28,by+30,10); ctx.fillStyle=i<b.hp?'#a374ff':'rgba(255,255,255,.7)'; ctx.fill(); }
    }
  }
  if(mode==='play'&&G.t<6&&G.phase==='run'){
    ctx.globalAlpha=clamp(6-G.t,0,1);
    const txt=isTouch?'Slide finger to steer • ⬆️ jump • '+['⚡','⚔️','🌙'][cfg.rider]+' attack'
      :'Move mouse to steer • SPACE = jump • CLICK = '+['rainbow zap','lance','moon magic'][cfg.rider];
    hudText(txt,CX,H*0.46,Math.min(26,W/30),'#5a2ca8','center'); ctx.globalAlpha=1;
  }
  if(mode==='play'&&G.t<2.5){ ctx.globalAlpha=clamp(2.5-G.t,0,1); hudText(`Go, ${cfg.name||'Sparkle'}!`,CX,H*0.22,Math.min(56,W/10),'#ff5fae','center'); ctx.globalAlpha=1; }
  if(mode==='play'&&!isTouch&&pointerX!==null&&!paused){ heartPath(ctx,pointerX,pointerY,9); ctx.fillStyle='#ff5fae'; ctx.fill(); ctx.lineWidth=2.5; ctx.strokeStyle='#fff'; ctx.stroke(); }
  if(paused){ ctx.fillStyle='rgba(90,44,168,.35)'; ctx.fillRect(0,0,W,H);
    hudText('Paused',CX,H*0.42,60,'#ff5fae','center'); hudText(isTouch?'Tap ⏸️ to keep riding':'Press P or click to keep riding',CX,H*0.52,26,'#5a2ca8','center'); }
  if(isTouch&&H>W&&mode==='play'){ hudText('↻ Turn sideways for a bigger view!',CX,H*0.56,Math.min(22,W/18),'#5a2ca8','center'); }
}
function drawRainbowTrail(){
  if(cfg.trail!=='rainbow'||G.hist.length<2) return;
  const pts=G.hist.map(h=>({x:h.x,d:h.s-G.scroll}));
  ctx.globalAlpha=0.85;
  for(let c=0;c<6;c++){
    const o0=-0.33+c*0.11, o1=o0+0.11; ctx.fillStyle=RAINBOW[c]; ctx.beginPath();
    pts.forEach((p,i)=>{ const q=proj(p.x+o0,p.d); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); });
    for(let i=pts.length-1;i>=0;i--){ const q=proj(pts[i].x+o1,pts[i].d); ctx.lineTo(q.x,q.y); }
    ctx.fill();
  }
  ctx.globalAlpha=1;
}
function render(){
  ctx.save();
  if(G.shake>0) ctx.translate(rand(-6,6),rand(-6,6));
  drawSky(); drawGround(); drawRainbowTrail();
  const list=G.objs.slice();
  list.push({type:'player',d:0});
  if(G.boss) list.push({type:'boss',d:G.boss.d,x:G.boss.x,w:2});
  list.sort((a,b)=>b.d-a.d);
  for(const o of list){ if(o.type==='player') drawPlayer(); else drawObj(o); }
  drawZaps(); drawParts(); drawTexts();
  ctx.restore();
  drawHUD();
}

// ---------- main loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!paused) update(dt);
  render();
  if(mode==='menu') drawPreview(now/1000);
  requestAnimationFrame(frame);
}

// ---------- menu ----------
const pv=document.getElementById('preview'), pg=pv.getContext('2d');
function drawPreview(t){
  pg.setTransform(1,0,0,1,0,0); pg.clearRect(0,0,pv.width,pv.height);
  const sc=pv.width/240; pg.setTransform(sc,0,0,sc,0,0);
  if(cfg.rider===2){
    const gr=pg.createLinearGradient(0,0,0,196); gr.addColorStop(0,'#1b1f5e'); gr.addColorStop(1,'#7b5ab8'); pg.fillStyle=gr; pg.fillRect(0,0,240,196);
    pg.fillStyle='#3f6f6a'; pg.fillRect(0,196,240,84);
    for(let i=0;i<18;i++){ const sx=(i*53)%240, sy=(i*37)%180+6; pg.globalAlpha=0.5+0.5*Math.sin(t*2+i); starPath(pg,sx,sy,2.5,4,0.4); pg.fillStyle='#fff'; pg.fill(); }
    pg.globalAlpha=1; crescentPath(pg,200,36,16,-0.5); pg.fillStyle='#f4f5ff'; pg.fill();
  }
  ell(pg,120,262,60,12,'rgba(60,30,100,.18)');
  drawUnicorn(pg,120,262,cfg.rider===1?82:cfg.rider===2?95:92,{fur:FURS[cfg.fur],mane:MANES[cfg.mane],armor:ARMORS[cfg.armor],rider:cfg.rider,wings:cfg.wings,t:t*0.6,air:false,atk:0,tilt:0,glow:cfg.rider===1?0:(Math.sin(t*3)*0.5+0.5)*0.7});
}
function buildSwatches(id,list,key,isMane){
  const el=document.getElementById(id); el.innerHTML='';
  list.forEach((c,i)=>{ const b=document.createElement('button');
    b.style.background=isMane?`linear-gradient(135deg,${c.join(',')})`:c;
    if(cfg[key]===i) b.classList.add('on');
    const price=PRICES[key][i], id=key+i;
    if(price&&!owns(id)){ b.classList.add('locked'); b.dataset.price=price; }
    const pick=()=>{ cfg[key]=i; saveCfg(); [...el.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
    b.onclick=()=>{ if(price&&!owns(id)) tryBuy(id,price,b,()=>{ b.classList.remove('locked'); pick(); }); else pick(); };
    el.appendChild(b); });
}
function shopMsg(t){ document.getElementById('shopMsg').textContent=t; }
function tryBuy(id,price,el,done){
  audioInit();
  if(bank.gems>=price){ bank.gems-=price; bank.owned.push(id); saveBank(); SFX.star(); done(); refreshBank(); shopMsg('✨ Yay! You got it!'); }
  else { SFX.bonk(); el.classList.remove('wiggle'); void el.offsetWidth; el.classList.add('wiggle');
    shopMsg(`You need ${price-bank.gems} more 💎 — go collect some!`); }
}
function refreshBank(){ document.getElementById('bankCount').textContent=bank.gems; buildShop(); }
function buildShop(){
  const el=document.getElementById('shop'); el.innerHTML='';
  for(const it of SHOP){
    const b=document.createElement('button'); b.className='shopItem';
    const have=it.price===0||owns(it.id);
    const on = it.kind==='trail' ? cfg.trail===it.val : cfg.wings;
    if(!have) b.classList.add('locked'); else if(on) b.classList.add('on');
    b.innerHTML=`${it.icon} ${it.name}<small></small>`;
    b.querySelector('small').textContent = !have ? `🔒 ${it.price} 💎` : on ? (it.kind==='wings'?'On! (tap to take off)':'Using it!') : (it.kind==='wings'?'Tap to put on':'Tap to use');
    b.onclick=()=>{
      const use=()=>{ if(it.kind==='trail') cfg.trail=it.val; else cfg.wings=!cfg.wings; saveCfg(); buildShop(); };
      if(!have) tryBuy(it.id,it.price,b,()=>{ if(it.kind==='trail') cfg.trail=it.val; else cfg.wings=true; saveCfg(); });
      else { use(); shopMsg(''); }
    };
    el.appendChild(b);
  }
}
function syncRider(){ document.querySelectorAll('.rider').forEach(b=>b.classList.toggle('on',+b.dataset.rider===cfg.rider));
  document.getElementById('armorBox').classList.toggle('off',!cfg.rider);
  document.getElementById('armorLabel').textContent=cfg.rider===2?'Dress':'Armor';
  document.getElementById('atkIcon').textContent=['⚡','⚔️','🌙'][cfg.rider]; }
document.querySelectorAll('.rider').forEach(b=>b.onclick=()=>{ cfg.rider=+b.dataset.rider; saveCfg(); syncRider(); });
buildSwatches('furSw',FURS,'fur'); buildSwatches('maneSw',MANES,'mane',true); buildSwatches('armorSw',ARMORS,'armor'); refreshBank();
const nameIn=document.getElementById('name'); nameIn.value=cfg.name;
nameIn.oninput=()=>{ cfg.name=nameIn.value.trim().slice(0,14); saveCfg(); };
nameIn.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Enter') nameIn.blur(); });
syncRider();
if(isTouch) document.getElementById('helpText').textContent='👆 Slide your finger to steer  •  ⬆️ button = jump  •  '+'⚔️/⚡ button = attack';

function startGame(){
  audioInit(); newGame(); mode='play'; paused=false;
  document.getElementById('menu').classList.add('hidden'); document.getElementById('end').classList.add('hidden');
  document.getElementById('topBtns').classList.remove('hidden'); document.body.classList.add('playing');
  pointerX=null; keys.left=keys.right=false;
  if(isTouch){ try{ document.documentElement.requestFullscreen?.().catch(()=>{}); }catch(e){} }
}
function showMenu(){ mode='menu'; paused=false; newGame(); refreshBank(); shopMsg('');
  document.getElementById('menu').classList.remove('hidden'); document.getElementById('end').classList.add('hidden');
  document.getElementById('topBtns').classList.add('hidden'); document.body.classList.remove('playing'); }
function showEnd(){
  mode='end'; document.body.classList.remove('playing'); document.getElementById('topBtns').classList.add('hidden');
  const n=cfg.name||'Sparkle', stars=G.gems>=70?3:G.gems>=35?2:1;
  bank.gems+=G.gems; saveBank(); refreshBank();
  document.getElementById('endTitle').textContent=`${n} saved the day!`;
  document.getElementById('endStars').innerHTML=[0,1,2].map(i=>`<span class="${i<stars?'':'stars-dim'}">⭐</span>`).join('');
  const st=document.getElementById('endStats'); st.innerHTML='';
  [`💎 Gems collected: ${G.gems}`,`💥 Baddies poofed: ${G.poofs}`,`💜 New friend: Grumbly the Dragon`,`🧰 Treasure chest: ${bank.gems} 💎 — spend them in the Sparkle Shop!`].forEach(s=>{ const d=document.createElement('div'); d.textContent=s; st.appendChild(d); });
  document.getElementById('end').classList.remove('hidden');
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('againBtn').onclick=startGame;
document.getElementById('changeBtn').onclick=showMenu;

// ---------- input ----------
let pointerY=0;
function togglePause(){ if(mode!=='play') return; paused=!paused; document.getElementById('pauseBtn').textContent=paused?'▶️':'⏸️'; }
function toggleMute(){ muted=!muted; document.getElementById('muteBtn').textContent=muted?'🔇':'🔊'; }
document.getElementById('pauseBtn').onclick=e=>{ e.stopPropagation(); togglePause(); };
document.getElementById('muteBtn').onclick=e=>{ e.stopPropagation(); toggleMute(); };
addEventListener('keydown',e=>{
  if(e.target===nameIn) return;
  const k=e.key;
  if(k===' '||k==='ArrowUp'||k==='w'||k==='W'){ e.preventDefault(); if(mode==='menu') return; jump(); }
  else if(k==='Enter'||k==='x'||k==='X'||k==='k'||k==='K'){ if(mode==='play'){ e.preventDefault(); attack(); } }
  else if(k==='ArrowLeft'||k==='a'||k==='A') keys.left=true;
  else if(k==='ArrowRight'||k==='d'||k==='D') keys.right=true;
  else if(k==='p'||k==='P'||k==='Escape') togglePause();
  else if(k==='m'||k==='M') toggleMute();
});
addEventListener('keyup',e=>{ const k=e.key; if(k==='ArrowLeft'||k==='a'||k==='A') keys.left=false; if(k==='ArrowRight'||k==='d'||k==='D') keys.right=false; });
addEventListener('mousemove',e=>{ pointerX=e.clientX; pointerY=e.clientY; pointerMoved=true; });
cv.addEventListener('mousedown',e=>{ if(mode!=='play') return; if(paused){ togglePause(); return; } if(e.button===2) jump(); else attack(); });
cv.addEventListener('contextmenu',e=>e.preventDefault());
// touch: finger on the canvas steers; the two round buttons jump & attack
const steerIds=new Set();
function touchSteer(e){ for(const t of e.changedTouches){ if(steerIds.has(t.identifier)){ pointerX=t.clientX; pointerMoved=true; } } }
cv.addEventListener('touchstart',e=>{ e.preventDefault(); for(const t of e.changedTouches){ steerIds.add(t.identifier); pointerX=t.clientX; pointerMoved=true; } },{passive:false});
cv.addEventListener('touchmove',e=>{ e.preventDefault(); touchSteer(e); },{passive:false});
const endTouch=e=>{ for(const t of e.changedTouches) steerIds.delete(t.identifier); };
cv.addEventListener('touchend',endTouch); cv.addEventListener('touchcancel',endTouch);
function holdBtn(id,fn){ const b=document.getElementById(id);
  b.addEventListener('touchstart',e=>{ e.preventDefault(); e.stopPropagation(); b.classList.add('down'); audioInit(); fn(); },{passive:false});
  b.addEventListener('touchend',e=>{ e.preventDefault(); b.classList.remove('down'); },{passive:false});
  b.addEventListener('mousedown',e=>{ e.preventDefault(); fn(); }); }
holdBtn('jumpBtn',jump); holdBtn('atkBtn',attack);
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&mode==='play'&&!paused) togglePause(); });

// test hook
window.__rj={ get G(){return G;}, get mode(){return mode;}, cfg, start:startGame, jump, attack,
  step(sec,dt=1/60){ for(let i=0;i<sec/dt;i++) update(dt); render(); } };

newGame();
requestAnimationFrame(frame);
</script>
