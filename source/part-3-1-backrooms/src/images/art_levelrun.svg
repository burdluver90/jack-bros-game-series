<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="vign" cx=".5" cy=".5" r=".75"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
    <linearGradient id="redwall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b0a0a"/><stop offset=".5" stop-color="#8b1414"/><stop offset="1" stop-color="#3b0a0a"/></linearGradient>
    <filter id="glowr" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="puddle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3b3b" stop-opacity=".5"/><stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#2a0606"/>
  <polygon points="0,0 1600,0 960,360 640,360" fill="#4a0c0c"/>
  <polygon points="0,0 640,360 640,540 0,900" fill="url(#redwall)"/>
  <polygon points="1600,0 960,360 960,540 1600,900" fill="url(#redwall)"/>
  <polygon points="0,900 640,540 960,540 1600,900" fill="#1a0404"/>
  <rect x="640" y="360" width="320" height="180" fill="#120202"/>
  <!-- red emergency lights -->
  <g fill="#ff2a2a" filter="url(#glowr)"><rect x="200" y="90" width="120" height="16"/><rect x="1280" y="90" width="120" height="16"/><rect x="500" y="250" width="70" height="10"/><rect x="1030" y="250" width="70" height="10"/></g>
  <!-- scrawled on the wall -->
  <text x="300" y="470" font-family="Arial Black, Arial" font-weight="900" font-size="64" fill="#fecaca" opacity=".85" transform="rotate(-6 300 470) skewY(14)">RUN FOR</text>
  <text x="1150" y="470" font-family="Arial Black, Arial" font-weight="900" font-size="64" fill="#fecaca" opacity=".85" text-anchor="middle" transform="rotate(6 1150 470) skewY(-14)">YOUR LIFE</text>
  <!-- the thing chasing you: a wall of black shapes far down the hall -->
  <g fill="#000"><ellipse cx="800" cy="470" rx="150" ry="70"/><path d="M660 470 l-30 -80 l40 50 z M940 470 l30 -80 l-40 50 z M740 420 l-6 -70 l26 54 z M860 420 l6 -70 l-26 54 z"/></g>
  <g fill="#fff" filter="url(#glowr)"><circle cx="760" cy="460" r="6"/><circle cx="840" cy="460" r="6"/><circle cx="720" cy="490" r="4"/><circle cx="880" cy="490" r="4"/></g>
  <!-- a heavy door slamming down at the end -->
  <rect x="660" y="360" width="280" height="40" fill="#525252"/><path d="M660 400 h280" stroke="#facc15" stroke-width="10" stroke-dasharray="30 20"/>
  <!-- detail pass -->
  <!-- numbered doors down both walls -->
  <g><polygon points="120,420 240,446 240,714 120,740" fill="#2a0505" stroke="#160202" stroke-width="4"/><text x="180" y="410" font-family="Arial Black, Arial" font-size="38" text-anchor="middle" fill="#fca5a5" opacity=".7">!13</text></g><g><polygon points="420,410 500,426 500,594 420,610" fill="#2a0505" stroke="#160202" stroke-width="4"/><text x="460" y="400" font-family="Arial Black, Arial" font-size="24" text-anchor="middle" fill="#fca5a5" opacity=".7">!12</text></g><g><polygon points="1360,420 1480,394 1480,766 1360,740" fill="#2a0505" stroke="#160202" stroke-width="4"/><text x="1420" y="410" font-family="Arial Black, Arial" font-size="38" text-anchor="middle" fill="#fca5a5" opacity=".7">!13B</text></g><g><polygon points="1100,410 1180,394 1180,626 1100,610" fill="#2a0505" stroke="#160202" stroke-width="4"/><text x="1140" y="400" font-family="Arial Black, Arial" font-size="24" text-anchor="middle" fill="#fca5a5" opacity=".7">!12B</text></g>
  <!-- red puddles reflecting the lights -->
  <g fill="url(#puddle)"><ellipse cx="520" cy="800" rx="160" ry="22"/><ellipse cx="1120" cy="760" rx="120" ry="16"/><ellipse cx="800" cy="610" rx="90" ry="10"/></g>
  <!-- more scrawls and arrows -->
  <text x="800" y="680" font-family="Arial Black, Arial" font-weight="900" font-size="54" text-anchor="middle" fill="#fecaca" opacity=".75">DON'T STOP</text>
  <g stroke="#fecaca" stroke-width="10" fill="none" opacity=".7" stroke-linecap="round"><path d="M640 760 l120 -60 M740 690 l20 10 l-10 20"/><path d="M960 760 l-120 -60 M860 690 l-20 10 l10 20"/></g>
  <!-- tendrils of the chaser reaching down the hall -->
  <g fill="none" stroke="#000" stroke-linecap="round"><path d="M700 480 C620 540 560 600 470 640" stroke-width="16"/><path d="M900 480 C990 540 1040 610 1130 650" stroke-width="16"/><path d="M760 500 C730 600 700 680 690 760" stroke-width="10"/><path d="M840 500 C870 600 900 690 920 770" stroke-width="10"/></g>
  <!-- sparks from the broken lights, junk on the floor, speed lines -->
  <path d="M260 106 l-22 14" stroke="#ffd166" stroke-width="3"/><path d="M260 106 l1 21" stroke="#ffd166" stroke-width="3"/><path d="M260 106 l23 38" stroke="#ffd166" stroke-width="3"/><path d="M1340 106 l24 11" stroke="#ffd166" stroke-width="3"/><path d="M1340 106 l15 12" stroke="#ffd166" stroke-width="3"/><path d="M1340 106 l30 18" stroke="#ffd166" stroke-width="3"/><path d="M535 260 l22 15" stroke="#ffd166" stroke-width="3"/><path d="M535 260 l-23 24" stroke="#ffd166" stroke-width="3"/><path d="M535 260 l0 18" stroke="#ffd166" stroke-width="3"/><path d="M1065 260 l29 16" stroke="#ffd166" stroke-width="3"/><path d="M1065 260 l23 23" stroke="#ffd166" stroke-width="3"/><path d="M1065 260 l-6 30" stroke="#ffd166" stroke-width="3"/><rect x="345" y="880" width="14" height="11" fill="#3a0a0a" transform="rotate(-5 800 800)"/><rect x="386" y="875" width="25" height="7" fill="#3a0a0a" transform="rotate(3 800 800)"/><rect x="1266" y="707" width="37" height="13" fill="#3a0a0a" transform="rotate(23 800 800)"/><rect x="314" y="859" width="31" height="12" fill="#3a0a0a" transform="rotate(-2 800 800)"/><rect x="896" y="703" width="29" height="7" fill="#3a0a0a" transform="rotate(-40 800 800)"/><rect x="392" y="863" width="13" height="10" fill="#3a0a0a" transform="rotate(3 800 800)"/><rect x="1045" y="784" width="22" height="13" fill="#3a0a0a" transform="rotate(6 800 800)"/><rect x="773" y="838" width="12" height="14" fill="#3a0a0a" transform="rotate(46 800 800)"/><rect x="826" y="707" width="19" height="7" fill="#3a0a0a" transform="rotate(11 800 800)"/><rect x="322" y="758" width="40" height="7" fill="#3a0a0a" transform="rotate(13 800 800)"/><rect x="1098" y="857" width="31" height="13" fill="#3a0a0a" transform="rotate(-18 800 800)"/><rect x="1217" y="702" width="21" height="10" fill="#3a0a0a" transform="rotate(-32 800 800)"/><rect x="994" y="856" width="16" height="14" fill="#3a0a0a" transform="rotate(-29 800 800)"/><rect x="1071" y="787" width="31" height="13" fill="#3a0a0a" transform="rotate(13 800 800)"/><rect x="1213" y="761" width="20" height="12" fill="#3a0a0a" transform="rotate(35 800 800)"/><rect x="556" y="750" width="30" height="12" fill="#3a0a0a" transform="rotate(46 800 800)"/><rect x="1236" y="751" width="38" height="9" fill="#3a0a0a" transform="rotate(-1 800 800)"/><rect x="524" y="849" width="39" height="11" fill="#3a0a0a" transform="rotate(-24 800 800)"/>
  <g stroke="#ff9b9b" stroke-width="4" opacity=".25" stroke-linecap="round"><path d="M0 300 L300 380"/><path d="M0 560 L320 520"/><path d="M1600 300 L1300 380"/><path d="M1600 560 L1280 520"/></g>
  <rect width="1600" height="900" fill="url(#vign)"/>
</svg>
