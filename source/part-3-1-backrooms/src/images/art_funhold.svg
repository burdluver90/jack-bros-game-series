  <path d="M0 150 Q170.0 210 340 150" stroke="#444" stroke-width="3" fill="none"/><path d="M-22 150 L22 150 L0 190 Z" fill="#e8443a"/><path d="M46 169 L90 169 L68 209 Z" fill="#3b82f6"/><path d="M114 179 L158 179 L136 219 Z" fill="#22c55e"/><path d="M182 179 L226 179 L204 219 Z" fill="#a855f7"/><path d="M250 169 L294 169 L272 209 Z" fill="#f59e0b"/><path d="M318 150 L362 150 L340 190 Z" fill="#ec4899"/><path d="M1040 150 Q1320.0 210 1600 150" stroke="#444" stroke-width="3" fill="none"/><path d="M1018 150 L1062 150 L1040 190 Z" fill="#e8443a"/><path d="M1080 162 L1124 162 L1102 202 Z" fill="#3b82f6"/><path d="M1142 171 L1186 171 L1164 211 Z" fill="#22c55e"/><path d="M1205 177 L1249 177 L1227 217 Z" fill="#a855f7"/><path d="M1267 180 L1311 180 L1289 220 Z" fill="#f59e0b"/><path d="M1329 180 L1373 180 L1351 220 Z" fill="#ec4899"/><path d="M1391 177 L1435 177 L1413 217 Z" fill="#fde047"/><path d="M1454 171 L1498 171 L1476 211 Z" fill="#e8443a"/><path d="M1516 162 L1560 162 L1538 202 Z" fill="#3b82f6"/><path d="M1578 150 L1622 150 L1600 190 Z" fill="#22c55e"/>
