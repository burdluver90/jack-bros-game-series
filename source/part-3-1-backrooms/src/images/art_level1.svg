<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f45"/><stop offset="1" stop-color="#1c1f24"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2d31"/><stop offset="1" stop-color="#4a4d50"/></linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b5f63"/><stop offset=".5" stop-color="#8a8e91"/><stop offset="1" stop-color="#46494d"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fffbe0" stop-opacity=".9"/><stop offset="1" stop-color="#fffbe0" stop-opacity="0"/></radialGradient>
    <radialGradient id="fog" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
    <linearGradient id="puddle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb4c4" stop-opacity=".55"/><stop offset="1" stop-color="#2b3a44" stop-opacity=".2"/></linearGradient>
    <radialGradient id="d2lamp"><stop offset="0" stop-color="#fff6c8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></radialGradient>
    <radialGradient id="d2ball" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#cbd5e1"/><stop offset="1" stop-color="#64748b"/></radialGradient>
    <filter id="d2glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="420" fill="url(#ceil)"/>
  <rect y="420" width="1600" height="480" fill="url(#floor)"/>
  <!-- far wall -->
  <rect x="620" y="330" width="360" height="190" fill="#25282c"/>
  <!-- ceiling lights receding -->
  <g fill="#fff6c8">
    <rect x="740" y="300" width="120" height="8"/><rect x="700" y="250" width="200" height="12"/><rect x="630" y="170" width="340" height="18"/><rect x="500" y="40" width="600" height="30"/>
  </g>
  <ellipse cx="800" cy="300" rx="160" ry="40" fill="url(#glow)"/><ellipse cx="800" cy="185" rx="320" ry="70" fill="url(#glow)" opacity=".7"/>
  <!-- pipes -->
  <g stroke="#6d5a3a" stroke-width="14" fill="none" opacity=".85"><path d="M0 110 L620 300 L620 330"/><path d="M1600 140 L980 300"/></g>
  <g stroke="#3f4a52" stroke-width="8" fill="none"><path d="M0 150 L640 320"/><path d="M1600 180 L960 320"/></g>
  <!-- pillars -->
  <rect x="160" y="60" width="130" height="840" fill="url(#pillar)"/>
  <rect x="1310" y="60" width="130" height="840" fill="url(#pillar)"/>
  <rect x="470" y="230" width="60" height="420" fill="url(#pillar)"/>
  <rect x="1070" y="230" width="60" height="420" fill="url(#pillar)"/>
  <rect x="660" y="330" width="26" height="220" fill="url(#pillar)"/>
  <rect x="914" y="330" width="26" height="220" fill="url(#pillar)"/>
  <!-- warning stripes -->
  <g fill="#d9b23a"><rect x="160" y="760" width="130" height="18"/><rect x="1310" y="760" width="130" height="18"/></g>
  <!-- crates with almond water -->
  <g transform="translate(1120 600)">
    <rect width="170" height="130" fill="#7a5a33" stroke="#4d3920" stroke-width="6"/>
    <path d="M0 0 L170 130 M170 0 L0 130" stroke="#4d3920" stroke-width="6"/>
    <rect x="30" y="-110" width="140" height="110" fill="#8a6a3d" stroke="#4d3920" stroke-width="6"/>
    <text x="100" y="-48" font-family="Arial" font-weight="bold" font-size="20" fill="#2b2012" text-anchor="middle">ALMOND</text>
    <text x="100" y="-24" font-family="Arial" font-weight="bold" font-size="20" fill="#2b2012" text-anchor="middle">WATER</text>
  </g>
  <!-- puddles -->
  <ellipse cx="760" cy="720" rx="260" ry="38" fill="url(#puddle)"/>
  <ellipse cx="420" cy="820" rx="180" ry="26" fill="url(#puddle)"/>
  <ellipse cx="780" cy="716" rx="70" ry="8" fill="#fff6c8" opacity=".35"/>
  <!-- detail pass 2 -->
  <!-- water stains and cracks on the far wall and pillars -->
  <ellipse cx="1247" cy="519" rx="38" ry="38" fill="#1a1f16" opacity="0.25"/><ellipse cx="1149" cy="162" rx="21" ry="28" fill="#1a1f16" opacity="0.25"/><ellipse cx="614" cy="336" rx="44" ry="26" fill="#1a1f16" opacity="0.25"/><ellipse cx="666" cy="186" rx="66" ry="16" fill="#1a1f16" opacity="0.25"/><ellipse cx="573" cy="347" rx="20" ry="17" fill="#1a1f16" opacity="0.25"/><ellipse cx="935" cy="352" rx="21" ry="13" fill="#1a1f16" opacity="0.25"/><ellipse cx="387" cy="483" rx="51" ry="23" fill="#1a1f16" opacity="0.25"/><ellipse cx="320" cy="382" rx="60" ry="33" fill="#1a1f16" opacity="0.25"/><ellipse cx="741" cy="303" rx="69" ry="11" fill="#1a1f16" opacity="0.25"/><ellipse cx="510" cy="520" rx="22" ry="28" fill="#1a1f16" opacity="0.25"/><path d="M955 476 L936 501 L919 518 L925 535 L931 550" stroke="#111" stroke-width="2" fill="none" opacity=".45"/><path d="M843 433 L818 454 L799 475 L806 495 L819 521" stroke="#111" stroke-width="2" fill="none" opacity=".45"/><path d="M535 233 L556 244 L560 260 L573 282 L555 306" stroke="#111" stroke-width="2" fill="none" opacity=".45"/><path d="M434 182 L410 201 L382 225 L369 249 L356 273" stroke="#111" stroke-width="2" fill="none" opacity=".45"/><path d="M877 195 L870 210 L874 225 L901 245 L906 257" stroke="#111" stroke-width="2" fill="none" opacity=".45"/><path d="M729 216 L705 241 L725 250 L740 271 L725 287" stroke="#111" stroke-width="2" fill="none" opacity=".45"/><path d="M1317 212 L1345 236 L1321 254 L1301 274 L1273 281" stroke="#111" stroke-width="2" fill="none" opacity=".45"/><path d="M1052 341 L1023 352 L1044 365 L1057 371 L1041 378" stroke="#111" stroke-width="2" fill="none" opacity=".45"/><path d="M1303 367 L1320 375 L1312 381 L1332 399 L1333 411" stroke="#111" stroke-width="2" fill="none" opacity=".45"/>
  <!-- hanging cables and a broken light tube dangling on one wire -->
  <g fill="none" stroke="#111" stroke-linecap="round"><path d="M420 0 q30 120 -10 180" stroke-width="4"/><path d="M1180 0 q-40 100 6 150" stroke-width="4"/><path d="M1000 0 v60" stroke-width="3"/></g>
  <g transform="translate(1000 60) rotate(28)"><rect x="-4" y="0" width="8" height="120" fill="#e5e7eb"/><rect x="-4" y="0" width="8" height="120" fill="#fff" opacity=".4"/></g>
  <!-- stencilled level number on a pillar -->
  <text x="160" y="380" font-family="Arial Black, Arial" font-size="44" fill="#d4d4d4" opacity=".55" transform="rotate(-90 160 380)">LEVEL 1</text>
  <!-- painted arrow and a smudged warning -->
  <g fill="none" stroke="#facc15" stroke-width="10" opacity=".55" stroke-linecap="round"><path d="M620 600 h160 M740 570 l40 30 l-40 30"/></g>
  <text x="1560" y="470" font-family="Arial Black, Arial" font-size="26" fill="#ef4444" opacity=".55" text-anchor="end">DON'T FOLLOW THE LIGHTS</text>
  <!-- trash, a dropped bottle and footprints through the puddles -->
  <g fill="#2b2b2b"><rect x="520" y="830" width="30" height="10" transform="rotate(20 520 830)"/><rect x="1080" y="800" width="24" height="8" transform="rotate(-30 1080 800)"/><path d="M300 860 l40 -10 l6 18 z"/></g>
  <g transform="translate(900 840) rotate(70)"><rect x="-10" y="-34" width="20" height="56" rx="6" fill="#bfdbfe" opacity=".8"/><rect x="-6" y="-46" width="12" height="14" fill="#93c5fd"/></g>
  <g fill="#0b0d10" opacity=".55"><ellipse cx="700" cy="880" rx="16" ry="7"/><ellipse cx="770" cy="854" rx="16" ry="7"/><ellipse cx="840" cy="828" rx="16" ry="7"/><ellipse cx="910" cy="802" rx="16" ry="7"/><ellipse cx="980" cy="776" rx="16" ry="7"/><ellipse cx="1050" cy="750" rx="16" ry="7"/></g>
  <rect width="1600" height="900" fill="url(#fog)"/>
</svg>
