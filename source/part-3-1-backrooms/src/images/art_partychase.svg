  <g transform="translate(140 760) rotate(-70)"><rect x="-30" y="-80" width="60" height="80" fill="#cfc6b0"/><rect x="-36" y="0" width="72" height="14" fill="#e5dfcf"/><path d="M-30 14 v50 M30 14 v50" stroke="#a8a08c" stroke-width="8"/></g>
